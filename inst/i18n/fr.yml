  ecodistrictblabl: "écodistricts"
  tkmb29:
    - "Sélectionnez un fichier de forme (.shp) en utilisant le bouton .shp. En mode observation, le fichier de forme est utilisé pour sélectionner des localisations de nids. En mode prédiction, le fichier de forme est utilisé comme arrière-plan des écodistricts afin de faciliter la sélection des écodistricts contenant les régions d'intérêt. Si seul le nom du fichier de forme est donné (ex: canada.shp), le fichier doit être situé dans le répertoire courant de R. Les coordonnées du fichier de forme doivent être en lat-long NAD83 (\"+proj=longlat +datum=NAD83 +no_defs +ellps=GRS80 +towgs84=0,0,0\").\n\nRépertoire courant actuel: "
    - "\n\nFichier de forme sélectionné actuellement: "
    - "\n\nProjection du fichier de forme: \n"
  tkmb30: "Entrez les noms de colonnes dans la table d'attributs séparés par \",\" afin de former un identifiant pour les régions à sélectionner. Utilisez le bouton attributs pour sélectionner les noms de la table d'attributs. Les 6 premières lignes de la table d'attributs seront montrées dans la console R. Si aucun attribut n'est sélectionné, la première colonne de la table d'attribut sera utilisée pour former les identifiants. Ne pas utiliser la virgule \",\" dans le nom des colonnes.\n\nSélection courante: "
  tkmb31: "Entrez le nom de régions formées à partir des attributs afin de sélectionner des localisations (séparés par \",\"). Utilisez le bouton des régions pour sélectionner les régions à partir d'une liste ou en sélectionnant les régions sur une carte. Si aucune sélection n'est faite, toutes les régions déterminées par les attributs considérés seront utilisées.\n\nSélection courante: "
  tkmb32: "Sélectionnez les espèces à partir de la liste d'espèces et utilisez le bouton espèces afin de les ajouter à la boîte ou entrez manuellement une liste d'espèces séparées par \",\" (ex: AMRO,WCSP). Les espèces peuvent également être entrées à partir des groupes.\n\nSélection courante: "
  tkmb33: "Entrez une année ou une séquence d'années séparées par \",\" (ex: 2000,2005). Par défaut, toutes les années sont utilisées. \n\nSélection courante: "
  spcallabl: "grouper par sp/groupe"
  yearcallabl: "grouper par année"
  regioncallabl: "grouper par région"
  orderspgrcallabl: "ordonner par sp/groupe"
  orderecocallabl: "ordonner par écodistrict"
  butcallabl: "CALENDRIER"
  tkmb34: "Entrez une séquence de valeurs dans l'intervalle [0,100] séparées par une \",\". La séquence doit commencer par 0 et se terminer par 100.\n\nValeurs par défaut en mode observation: 0,1,5,10,20,40,60,80,100\nValeurs par défaut en mode prédiction: 0,5,10,20,40,60,80,100\n\nSélection courante: "
  tkmb35: "Entrez une série de couleurs séparées par \",\" pour utiliser dans le calendrier. Les couleurs peuvent être représentées par leur nom en anglais ainsi que par des chiffres ou leur code alpha numérique. Tapez \"?colors\" dans la console R pour obtenir de l'aide sur la spécification des couleurs.\n\nValeurs par défaut en mode observation: c(\"grey85\",\"grey65\",brewer.pal(length(percentages)-4,\"YlOrRd\"),\"darkred\")\n\nValeurs par défaut en mode prédiction: c(\"white\",brewer.pal(length(percentages)-3,\"YlOrRd\"),\"darkred\")\n\nSélection courante: "
  tkmb36: "Lorsque le nombre de nids pour une combinaison donnée est inférieur à la valeur spécifiée dans la boîte de droite, aucune variation en intensité ne sera donnée et une couleur uniforme (deepskyblue3) sera utilisée. Cette couleur peut être modifiée dans la boîte de gauche."
