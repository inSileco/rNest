rNest_tcltk:
  warninglabl: "Avertissement"
  warningtextlabl:
    - "Les renseignements techniques présentés dans rNid ne le sont qu’à titre de conseils. Toute personne doit se conformer à l'ensemble des exigences pertinentes des lois (par exemple les lois provinciales ou territoriales), des règlements et des permis, y compris, entre autres, la Loi de 1994 sur la convention concernant les oiseaux migrateurs (LCOM) et le Règlement sur les oiseaux migrateurs (ROM). Il est important de noter que certaines espèces d'oiseaux protégés en vertu de la LCOM ont également été inscrites à l'annexe 1 de la Loi sur les espèces en péril (LEP). Ces espèces sont protégées à la fois en vertu de LCOM et de la LEP. Ces conseils ne donnent pas l'autorisation de blesser ou de tuer des oiseaux migrateurs, ni de déranger, de détruire ou de prendre des nids ou des œufs en vertu du ROM, et ils n'offrent pas non plus la garantie que les activités ne donnent pas lieu à une violation ROM ou d'autres lois et règlements. Les renseignements présentés ici sont de nature générale et ne doivent pas servir d'avis officiel au sujet des conséquences juridiques de toute activité particulière. Ils ne remplacent pas la LCOM, le ROM ou toute autre loi."
    - "La responsabilité incombe aux particuliers et aux entreprises d’évaluer leur propre niveau de risque en tenant compte des oiseaux migrateurs en présence et d’établir les mesures pertinentes d’évitement et d’atténuation appropriées. Il est possible que localement la période de nidification commence et se termine plus tôt ou plus tard que les dates fournies dans rNid en raison de conditions microclimatiques particulières à certains lieux (p. ex. milieux côtiers ou en altitude), ou en raison de variations climatiques interannuelles (p. ex. printemps hâtif, été froid et pluvieux). Les renseignements techniques publiés dans rNid seront mis à jour – et possiblement modifiés – à mesure que de nouvelles données seront disponibles. Chaque fois que des nids contenant des œufs ou des oisillons sont découverts, la zone immédiate doit être évitée jusqu'à ce que les oisillons aient quitté naturellement l’entourage immédiat du nid. Cette mesure de protection doit être appliquée même si le nid a été trouvé en dehors de la période générale de nidification fournie par rNid. Une fois hors du nid, les oisillons demeurent vulnérables et il est recommandé d’agir avec précaution."
    - "Pour obtenir de plus amples renseignements, veuillez consulter le site Web d’Environnement Canada à l’adresse suivante : www.ec.gc.ca/paom-itmb."
    - "Lorsque rNid est utilisé en mode observation, il est important de mentionner que les observations de nids contenues dans la base de données NestWatch sont concentrées dans le sud et les régions habitées du Canada. Par conséquent, il n'y a pas assez d'information dans plusieurs parties du Canada pour obtenir un portrait représentatif de la saison de nidification en se basant uniquement sur les observations de nids. De plus plusieurs espèces sont surreprésentées dans les données et peuvent avoir une influence disproportionnée sur les calendriers de nidification lorsque des groupes sont utilisés. En mode observation, les calendriers de nidification doivent être interprétés avec prudence en raison du manque de données, des espèces surreprésentées et des observations de nidification aberrantes ou extrêmes qui peuvent sévèrement affecter leur fiabilité."
  loadingmsglabl: "Chargement des données et de l'interface rNid..."

