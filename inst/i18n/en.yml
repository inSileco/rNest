  ecodistrictblabl: "ecodistricts"
  tkmb29:
    - "Choose a shapefile with the .shp extension (ex: canada.shp) using the shapefile button. When in the observation mode, the shapefile is used to select nest locations. When in the prediction mode, the shapefile is plotted over the ecodistricts to facilitate the selection of ecodistricts containing the region of interest. If only the name of the .shp shapefile is given, it has to be in the working directory. Coordinates of the shapefile need to be in lat-long NAD83 (\"+proj=longlat +datum=NAD83 +no_defs +ellps=GRS80 +towgs84=0,0,0\").\n\nCurrent working directory: "
    - "\n\nCurrent selection: "
    - "\n\nCurrent projection of the shapefile: \n"
  tkmb30: "Enter the name of columns in the attribute table of the shapefile separated by \",\" to build ids of polygons. Click the id attribute button to select the column names in the attributes table. The first 6 lines of the attribute table will be printed in the R console. If nothing is selected, the first column from the attribute table will be chosen. Do not use the \",\" character in the names of columns.\n\nCurrent selection: "
  tkmb31: "Enter the name of regions built with ids in the attribute table (separated by \",\") to restrict locations. Click the region button to select the regions from a list or by selecting regions on a map. If nothing is selected, all regions determined by the id selection will be considered.\n\nCurrent selection: "
  tkmb32: "Select species from the species list and use the species button to add them to the box or enter a list of species code separated by \",\" (ex: AMRO,WCSP) to restrict the nests selected. Species can also be added through the group buttons.\n\nCurrent selection: "
  tkmb33: "Enter a year or a sequence of years separated by \",\" (ex: 2000,2005) to restrict the nests selected. All years are used by default. \n\nCurrent selection: "
  spcallabl: "pool by sp/group"
  yearcallabl: "pool by year"
  regioncallabl: "pool by region"
  orderspgrcallabl: "order by sp/group"
  orderecocallabl: "order by ecodistrict"
  butcallabl: "GET CALENDAR"
  tkmb34: "Enter a set of values in the [0,100] interval separated by \",\" to be used as cut-offs in the calendar. The sequence must start with 0 and end with 100.\n\nDefault observation mode: 0,1,5,10,20,40,60,80,100\nDefault prediction mode: 0,5,10,20,40,60,80,100\n\nCurrent selection: "
  tkmb35: "Enter a set of colors separated by \",\" to be used in the graphic. Colors can be represented by their english name as well as by their number or their alpha numeric code. Type \"?colors\" in the R console to get help on color specifications.\n\nDefault observation mode: c(\"grey85\",\"grey65\",brewer.pal(length(percentages)-4,\"YlOrRd\"),\"darkred\")\n\nDefault prediction mode: c(\"white\",brewer.pal(length(percentages)-3,\"YlOrRd\"),\"darkred\")\n\nCurrent selection: "
  tkmb36: "When the number of nests for a given combination is inferior to the specified value in the right box, no colors intensities will be given and a uniform color will be used. The default color is deepskyblue and it can be changed in the left box."
